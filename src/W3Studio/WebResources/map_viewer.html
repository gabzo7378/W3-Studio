<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <title>W3 Studio 3D World Map Viewport</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f1218;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    #loading-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 340px;
      background: rgba(18, 22, 30, 0.94);
      border: 1px solid #3e4555;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      border-radius: 4px;
      padding: 16px 20px;
      text-align: left;
      color: #fff;
      z-index: 20;
      display: none;
    }

    #loading-spinner {
      font-size: 12.5px;
      font-weight: 600;
      color: #f0f2f5;
      margin-bottom: 8px;
    }

    .progress-track {
      width: 100%;
      height: 14px;
      background: #0d1016;
      border: 1px solid #3e4555;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    #loading-bar-fill {
      width: 15%;
      height: 100%;
      background: #0078d7;
      transition: width 0.15s ease-out;
    }

    #loading-details {
      font-size: 11px;
      color: #a0a6b2;
    }

    #no-map-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f1218;
      z-index: 15;
      color: #9aa0a6;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="map-canvas"></canvas>

    <div id="no-map-hint"></div>

    <div id="loading-overlay">
      <div id="loading-spinner">Cargando Terreno y Modelos 3D...</div>
      <div class="progress-track"><div id="loading-bar-fill"></div></div>
      <div id="loading-details">Inicializando mallas del mapa</div>
    </div>
  </div>

  <script src="viewer.min.js"></script>
  <script src="map_viewer_fixes.js"></script>
  <script src="map_viewer.js"></script>
</body>
</html>
